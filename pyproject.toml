[project]
name = "coremusic"
version = "0.2.5"
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
description = "Python bindings for Apple CoreAudio"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Cython",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# Audio analysis features (beat detection, pitch detection, etc.)
analysis = ["numpy>=2.0", "scipy>=1.10"]
# Visualization features (waveform plots, spectrograms)
visualization = ["matplotlib>=3.8"]
# All optional features
all = ["numpy>=2.0", "scipy>=1.10", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/shakfu/coremusic"
Issues = "https://github.com/shakfu/coremusic/issues"

[project.scripts]
coremusic = "coremusic.cli:main"

[dependency-groups]
dev = [
    "numpy>=2.0",
    "scipy>=1.10",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "twine>=5.0",
    "mypy>=1.10.0",
    "matplotlib>=3.8",
    "ruff>=0.16.0",
]

[build-system]
requires = ["scikit-build-core>=0.8", "cython"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/coremusic"]
wheel.exclude = ["**.pyx", "**.pxd", "**.pxi", "**.c", "**.cpp", "**.h", "**.hpp"]
cmake.build-type = "Release"
sdist.include = [
    "thirdparty",
    "THIRDPARTY.md",
    "src/coremusic/*.pyi",
    "src/coremusic/*.pxd",
    "src/coremusic/*.pyx",
    "src/coremusic/*.c",
    "src/coremusic/*.cpp",
    "src/coremusic/py.typed",

    # Thirdparty: Ableton Link headers and licenses
    "thirdparty/link/LICENSE.md",
    "thirdparty/link/GNU-GPL-v2.0.md",
    "thirdparty/link/include/**/*.hpp",
    "thirdparty/link/include/**/*.ipp",
    "thirdparty/link/modules/asio-standalone/asio/LICENSE_1_0.txt",
    "thirdparty/link/modules/asio-standalone/asio/include/**/*.hpp",
    "thirdparty/link/modules/asio-standalone/asio/include/**/*.ipp",
]

sdist.exclude = [".git/", "*.egg-info/"]



[tool.ruff.lint]
# Pinned explicitly. Ruff's default rule set widened substantially in 0.16,
# which turned a clean tree into 955 findings overnight without a line of code
# changing. Selecting by name means an upgrade can add rules to ruff without
# silently redefining what "lint clean" means here.
#
# This is the previous default (E4/E7/E9/F) plus the families that have been
# worked through. The remaining opinionated ones are deliberately out and can
# be adopted one at a time:
#
#   SIM (77)   flake8-simplify
#   RUF (132)  ruff-specific
#   PERF (50)  perflint
#   BLE (330)  blind-except - would mean narrowing 242 `except Exception`
#              clauses in the library, changing which errors propagate; see
#              docs/dev/error_decorator.md, where that refactor was deferred
#   ANN, D, S, TRY, EM, PL - thousands each, stylistic
select = [
    "E4", "E7", "E9", "F", "I", "W", "UP", "C4", "PIE",
    "B",     # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
# Documentation examples are structured one self-contained snippet per section,
# so each section repeats the imports it needs and may not use every name it
# shows. That is deliberate: the snippet a reader copies has to stand alone.
"examples/**/*.py" = ["E402", "F401", "F811", "F841"]
# Scale and chord types intentionally share values: Ionian *is* major, Aeolian
# *is* natural minor, and a dominant 7th with a sharp 5 *is* an augmented 7th.
# Python turns the duplicates into aliases, which is the desired behaviour.
"src/coremusic/music/theory.py" = ["PIE796"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/coremusic"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
strict = true
show_error_codes = true
mypy_path = "src"
packages = ["coremusic"]
namespace_packages = true

[[tool.mypy.overrides]]
module = "coremusic.capi"
ignore_missing_imports = false
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "numpy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "coremusic.async_io"
# Stub file inconsistencies - actual code has proper type hints
warn_unused_ignores = false
disable_error_code = ["arg-type", "attr-defined"]
